name: ci

on:
  push:
    branches: [main]
    # `branches` and `tags` are mutually exclusive filters: listing branches
    # alone means tag pushes never trigger a run. Both are needed, otherwise
    # the release job never fires.
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Scoped to this job on purpose. RUSTFLAGS reaches every crate in the
      # dependency graph, and a warning in a third-party crate would fail a
      # release build over something nobody here can fix.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo fmt --check

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple targets need the Apple SDK, which only a macOS runner has.
          # cross cannot supply it, so these build natively.
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          # Linux and Windows cross-compile from Linux via Docker.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - runner: ubuntu-latest
            target: x86_64-pc-windows-msvc
            cross: true
          - runner: ubuntu-latest
            target: aarch64-pc-windows-msvc
            cross: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross drives a container per target, which needs a few system packages
      # that the runner image does not ship with.
      - name: Set up cross
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev fuse-overlayfs
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --features http --target ${{ matrix.target }}
          else
            cargo build --release --features http --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          BIN=mcp-sandman
          [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && BIN=mcp-sandman.exe
          [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ] && BIN=mcp-sandman.exe

          STAGE="stage-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/$BIN" "$STAGE/"
          cp README.en.md "$STAGE/"
          cp LICENSE "$STAGE/"

          tar -czf "mcp-sandman-${{ matrix.target }}.tar.gz" -C "$STAGE" .

      - uses: softprops/action-gh-release@v2
        with:
          files: mcp-sandman-${{ matrix.target }}.tar.gz
          fail_on_unmatched_files: false