[package]
name = "mcp-sandman"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A policy-enforcing sandbox proxy for Model Context Protocol servers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/xiaoy-ovo/mcp-sandman"
homepage = "https://github.com/xiaoy-ovo/mcp-sandman"
keywords = ["mcp", "sandbox", "security", "agent", "proxy"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mcp-sandman"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "process",
    "time",
    "signal",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
globset = "0.4"

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["json", "rustls-tls", "stream"]

[features]
default = []
http = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true